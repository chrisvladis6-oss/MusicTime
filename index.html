<!doctype html>
<html lang="el">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#121212">
<title>Η Δισκοθήκη μας</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap">
<style>
/* Layout: one column library (header → search → playlists → track list), fixed mini-player at the bottom, full-screen "now playing" sheet on tap. Spotify-style: near-black, green accent, heavy sans, colour wash at the top. */
:root {
  --bg: #121212; --surface: #181818; --surface-2: #282828; --line: #333333;
  --fg: #ffffff; --muted: #b3b3b3; --accent: #1ed760; --accent-ink: #000000;
  --accent-soft: rgba(30,215,96,.14); --danger: #f15e6c;
  --hero: #3b2d78;
  --font-display: "Inter", "Segoe UI", Roboto, Arial, sans-serif;
  --font-body: "Inter", "Segoe UI", Roboto, Arial, sans-serif;
  --r: 6px;
  color-scheme: dark;
}
.hero-wash { position: absolute; top: 0; left: 0; right: 0; height: 360px; background: linear-gradient(to bottom, var(--hero), var(--bg)); z-index: -1; transition: background .4s; pointer-events: none; }
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--bg); color: var(--fg); font-family: var(--font-body); font-size: 15px; line-height: 1.45; -webkit-tap-highlight-color: transparent; }
img { max-width: 100%; }
button, input, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.wrap { position: relative; isolation: isolate; max-width: 760px; margin: 0 auto; padding-inline: 16px; padding-block: calc(20px + env(safe-area-inset-top, 0px)) 150px; }

header.top { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.eyebrow { font-size: 12px; letter-spacing: .02em; color: var(--fg); font-weight: 700; }
h1 { font-family: var(--font-display); font-weight: 900; letter-spacing: -.04em; font-size: clamp(32px, 9vw, 52px); line-height: 1.02; margin: 4px 0 0; text-wrap: balance; }
.stats { color: var(--muted); font-size: 13px; margin-top: 6px; font-variant-numeric: tabular-nums; }

.btn { display: inline-flex; align-items: center; gap: 8px; border: 0; border-radius: 999px; padding: 11px 22px; font-weight: 700; background: var(--surface-2); }
.btn.primary { background: var(--accent); color: var(--accent-ink); }
.btn.ghost { background: transparent; border: 1px solid var(--line); }
.btn.danger { background: transparent; color: var(--danger); border: 1px solid var(--danger); }
.btn:disabled { opacity: .5; cursor: default; }
.btn svg { width: 18px; height: 18px; }

.toolbar { display: flex; gap: 10px; margin: 22px 0 10px; align-items: center; flex-wrap: wrap; }
.search { flex: 1 1 220px; min-width: 0; display: flex; align-items: center; gap: 8px; background: rgba(255,255,255,.1); border: 0; border-radius: 6px; padding: 9px 12px; }
.search input { border: 0; background: transparent; outline: none; width: 100%; }
.search svg { width: 18px; height: 18px; color: var(--muted); flex: none; }
.chip { border: 0; background: rgba(255,255,255,.1); border-radius: 999px; padding: 8px 14px; font-size: 13px; font-weight: 500; color: var(--fg); display: inline-flex; align-items: center; gap: 7px; white-space: nowrap; flex: none; }
.chip[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); }
.chip:hover { background: rgba(255,255,255,.16); }
.chip[aria-pressed="true"]:hover { background: #3be477; }
.chip .dot { width: 8px; height: 8px; border-radius: 50%; flex: none; }
.chip.add { background: transparent; border: 1px solid rgba(255,255,255,.3); }
.lists { display: flex; gap: 8px; overflow-x: auto; padding-block: 4px; scrollbar-width: none; margin-inline: -16px; padding-inline: 16px; }
.lists::-webkit-scrollbar { display: none; }
.plhead { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-top: 16px; flex-wrap: wrap; }
.plhead h2 { font-family: var(--font-display); font-weight: 900; letter-spacing: -.04em; font-size: clamp(30px, 8vw, 44px); line-height: 1.05; margin: 0; overflow-wrap: anywhere; min-width: 0; }
.plhead .sub { color: var(--muted); font-size: 13px; }

.playall { display: flex; align-items: center; gap: 14px; margin: 18px 0 8px; }
.bigplay { width: 54px; height: 54px; border-radius: 50%; border: 0; background: var(--accent); color: var(--accent-ink); display: grid; place-items: center; flex: none; }
.bigplay svg { width: 24px; height: 24px; }
.playall .lbl { font-weight: 600; }
.playall .sub { color: var(--muted); font-size: 13px; }

ol.tracks { list-style: none; margin: 8px 0 0; padding: 0; display: grid; gap: 2px; }
.track { display: grid; grid-template-columns: minmax(0,1fr) auto auto; align-items: center; gap: 8px; padding: 6px 4px 6px 8px; border-radius: var(--r); }
.track:hover, .track:active { background: rgba(255,255,255,.07); }
.track .hit { border: 0; background: transparent; padding: 0; text-align: left; display: grid; grid-template-columns: 24px 48px minmax(0,1fr); align-items: center; gap: 12px; min-width: 0; }
.track .num { color: var(--muted); font-size: 13px; text-align: center; font-variant-numeric: tabular-nums; }
.track.current .num { color: var(--accent); }
.cover { width: 48px; height: 48px; border-radius: 4px; background: var(--surface-2); display: grid; place-items: center; overflow: hidden; font-family: var(--font-display); font-weight: 900; letter-spacing: -.04em; color: #fff; font-size: 20px; }
.cover img { width: 100%; height: 100%; object-fit: cover; display: block; }
.meta { min-width: 0; }
.meta .t { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.track.current .meta .t { color: var(--accent); }
.meta .a { color: var(--muted); font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.dur { color: var(--muted); font-size: 13px; font-variant-numeric: tabular-nums; }
.iconbtn { border: 0; background: transparent; width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; color: var(--muted); }
.iconbtn:hover { color: var(--fg); background: var(--surface-2); }
.iconbtn svg { width: 20px; height: 20px; }
.iconbtn.on { color: var(--accent); }

.empty { border: 0; background: var(--surface); border-radius: 8px; padding: 28px 20px; text-align: center; color: var(--muted); margin-top: 18px; display: grid; gap: 12px; justify-items: center; }
.empty strong { color: var(--fg); font-size: 17px; }
.foot { color: var(--muted); font-size: 12px; margin-top: 28px; display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.foot button { border: 0; background: none; color: var(--muted); text-decoration: underline; padding: 0; font-size: 12px; }

.mini { position: fixed; left: 0; right: 0; bottom: 0; padding: 8px 10px calc(8px + env(safe-area-inset-bottom, 0px)); z-index: 20; }
.mini-inner { max-width: 760px; margin: 0 auto; background: var(--mini, #2a2a2a); border-radius: 8px; display: grid; grid-template-columns: minmax(0,1fr) auto; gap: 8px; align-items: center; padding: 8px 8px 10px 8px; transition: background .4s; position: relative; overflow: hidden; box-shadow: 0 10px 30px rgba(0,0,0,.35); }
.mini .open { border: 0; background: transparent; padding: 0; text-align: left; display: grid; grid-template-columns: 44px minmax(0,1fr); gap: 12px; align-items: center; min-width: 0; }
.mini .cover { width: 44px; height: 44px; font-size: 18px; }
.mini .ctrls { display: flex; align-items: center; gap: 2px; }
.mini .ctrls .iconbtn { color: var(--fg); }
.mini .ctrls .iconbtn.on { color: var(--accent); }
.mini-prog { background: rgba(255,255,255,.25) !important; position: absolute; left: 8px; right: 8px; bottom: 3px; height: 2px; background: var(--line); border-radius: 2px; }
.mini-prog i { display: block; height: 100%; width: 0; background: var(--fg); border-radius: 2px; }

.sheet { position: fixed; inset: 0; z-index: 30; background: var(--bg); overflow-y: auto; padding: calc(12px + env(safe-area-inset-top, 0px)) 16px calc(24px + env(safe-area-inset-bottom, 0px)); }
.sheet::before { content: ""; position: fixed; inset: 0; background: linear-gradient(to bottom, var(--glow, #3b2d78) 0%, var(--bg) 85%); pointer-events: none; }
.sheet-in { position: relative; max-width: 460px; margin: 0 auto; display: grid; gap: 18px; }
.sheet-top { display: flex; justify-content: space-between; align-items: center; }
.np-cover { width: 100%; height: auto; aspect-ratio: 1; max-width: 100%; border-radius: 12px; font-size: clamp(64px, 22vw, 120px); box-shadow: 0 24px 60px rgba(0,0,0,.45); }
.np-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.np-title { font-family: var(--font-display); font-weight: 800; letter-spacing: -.02em; font-size: 24px; line-height: 1.1; margin: 0; overflow-wrap: anywhere; }
.np-artist { color: var(--muted); margin-top: 4px; }
.scrub input { width: 100%; margin: 0; -webkit-appearance: none; appearance: none; height: 4px; border-radius: 2px; background: linear-gradient(to right, var(--fg) var(--pct, 0%), rgba(255,255,255,.25) var(--pct, 0%)); outline: none; }
.scrub input::-webkit-slider-thumb { -webkit-appearance: none; width: 12px; height: 12px; border-radius: 50%; background: var(--fg); border: 0; }
.scrub input::-moz-range-thumb { width: 12px; height: 12px; border-radius: 50%; background: var(--fg); border: 0; }
.scrub input:active { background: linear-gradient(to right, var(--accent) var(--pct, 0%), rgba(255,255,255,.25) var(--pct, 0%)); }
.times { display: flex; justify-content: space-between; color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; margin-top: 4px; }
.transport { display: flex; justify-content: space-between; align-items: center; }
.transport .iconbtn { width: 48px; height: 48px; color: var(--fg); }
.transport .iconbtn svg { width: 26px; height: 26px; }
.transport .iconbtn.mode { color: var(--muted); }
.transport .iconbtn.mode.on { color: var(--accent); }
.transport .bigplay { width: 68px; height: 68px; background: var(--fg); color: var(--bg); }
.transport .bigplay svg { width: 30px; height: 30px; }
.note { background: var(--surface); border-radius: 12px; padding: 16px; white-space: pre-wrap; line-height: 1.6; }
.note h3 { margin: 0 0 8px; font-size: 13px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }

.modal { position: fixed; inset: 0; z-index: 40; background: rgba(8,6,12,.6); display: grid; place-items: end center; }
@media (min-width: 640px) { .modal { place-items: center; padding: 24px; } }
.panel { background: var(--surface); width: 100%; max-width: 520px; border-radius: 16px 16px 0 0; padding: 20px 16px calc(20px + env(safe-area-inset-bottom, 0px)); display: grid; gap: 14px; max-height: 92vh; overflow-y: auto; }
@media (min-width: 640px) { .panel { border-radius: 16px; padding: 24px; } }
.panel h2 { font-family: var(--font-display); font-weight: 800; letter-spacing: -.02em; font-size: 24px; margin: 0; }
.field { display: grid; gap: 6px; }
.field > label { font-size: 13px; font-weight: 600; color: var(--muted); }
.field input[type=text], .field textarea { background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; width: 100%; }
.field textarea { min-height: 90px; resize: vertical; }
.drop { border: 1.5px dashed rgba(255,255,255,.25); border-radius: 8px; padding: 18px; text-align: center; color: var(--muted); display: grid; gap: 6px; }
.drop strong { color: var(--fg); }
.coverpick { display: flex; align-items: center; gap: 12px; }
.coverpick .cover { width: 64px; height: 64px; }
.row-end { display: flex; justify-content: flex-end; gap: 10px; flex-wrap: wrap; }
.row-split { display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
.checks { display: flex; flex-wrap: wrap; gap: 8px; }
.check { display: inline-flex; align-items: center; gap: 8px; border: 1px solid rgba(255,255,255,.2); border-radius: 999px; padding: 6px 12px; font-size: 13px; font-weight: 600; cursor: pointer; }
.check input { accent-color: var(--accent); margin: 0; }
.check:has(input:checked) { border-color: var(--accent); background: var(--accent-soft); }
.prog { height: 6px; background: var(--bg); border-radius: 6px; overflow: hidden; }
.prog i { display: block; height: 100%; width: 0; background: var(--accent); transition: width .2s; }
.msg { font-size: 13px; color: var(--muted); }
.msg.err { color: var(--danger); }
.queue-list { display: grid; gap: 6px; font-size: 13px; }
.queue-list div { display: flex; justify-content: space-between; gap: 8px; }
.queue-list span:first-child { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(96px + env(safe-area-inset-bottom, 0px)); background: var(--fg); color: var(--bg); padding: 10px 16px; border-radius: 999px; font-weight: 600; font-size: 14px; z-index: 50; max-width: calc(100% - 32px); text-align: center; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>
</head>
<body>
<div class="wrap">
  <div class="hero-wash" aria-hidden="true"></div>
  <header class="top">
    <div>
      <div class="eyebrow">Δικά της τραγούδια</div>
      <h1>Η Δισκοθήκη μας</h1>
      <div class="stats" id="stats">Φόρτωση…</div>
    </div>
    <button class="btn primary" id="uploadBtn">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
      Προσθήκη
    </button>
  </header>

  <div class="toolbar">
    <div class="search">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>
      <label class="sr" for="q">Αναζήτηση</label>
      <input id="q" type="search" placeholder="Αναζήτηση τραγουδιού" autocomplete="off">
    </div>
  </div>
  <div class="lists" id="lists" role="toolbar" aria-label="Playlists"></div>

  <div class="plhead" id="plhead" hidden>
    <div style="min-width:0"><div class="eyebrow">Playlist</div><h2 id="plName"></h2><div class="sub" id="plSub"></div></div>
    <button class="btn ghost" id="plEdit">Μετονομασία</button>
  </div>

  <div class="playall" id="playall" hidden>
    <button class="bigplay" id="playAllBtn" aria-label="Παίξε όλα">
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
    </button>
    <button class="iconbtn" id="shuffleAll" aria-label="Τυχαία σειρά">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M16 3h5v5M4 20 21 3M21 16v5h-5M15 15l6 6M4 4l5 5"/></svg>
    </button>
    <div><div class="lbl">Παίξε όλα</div><div class="sub" id="playAllSub"></div></div>
  </div>

  <ol class="tracks" id="tracks"></ol>
  <div class="empty" id="empty" hidden></div>
  <div class="foot" id="foot"></div>
</div>

<div class="mini" id="mini" hidden>
  <div class="mini-inner">
    <button class="open" id="openSheet" aria-label="Άνοιγμα αναπαραγωγής">
      <div class="cover" id="miniCover"></div>
      <div class="meta"><div class="t" id="miniTitle"></div><div class="a" id="miniArtist"></div></div>
    </button>
    <div class="ctrls">
      <button class="iconbtn" id="miniFav" aria-label="Αγαπημένο"></button>
      <button class="iconbtn" id="miniPlay" aria-label="Αναπαραγωγή"></button>
    </div>
    <div class="mini-prog"><i id="miniProg"></i></div>
  </div>
</div>

<div class="sheet" id="sheet" hidden>
  <div class="sheet-in">
    <div class="sheet-top">
      <button class="iconbtn" id="closeSheet" aria-label="Κλείσιμο">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 9l6 6 6-6"/></svg>
      </button>
      <div class="eyebrow">Παίζει τώρα</div>
      <button class="iconbtn" id="editCurrent" aria-label="Επεξεργασία">
        <svg viewBox="0 0 24 24" fill="currentColor"><circle cx="5" cy="12" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="19" cy="12" r="2"/></svg>
      </button>
    </div>
    <div class="cover np-cover" id="npCover"></div>
    <div class="np-row">
      <div style="min-width:0">
        <h2 class="np-title" id="npTitle"></h2>
        <div class="np-artist" id="npArtist"></div>
      </div>
      <button class="iconbtn" id="npFav" aria-label="Αγαπημένο"></button>
    </div>
    <div class="scrub">
      <label class="sr" for="seek">Θέση</label>
      <input type="range" id="seek" min="0" max="1000" value="0">
      <div class="times"><span id="tCur">0:00</span><span id="tDur">0:00</span></div>
    </div>
    <div class="transport">
      <button class="iconbtn mode" id="shuffleBtn" aria-label="Τυχαία σειρά">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M16 3h5v5M4 20 21 3M21 16v5h-5M15 15l6 6M4 4l5 5"/></svg>
      </button>
      <button class="iconbtn" id="prevBtn" aria-label="Προηγούμενο">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 5h2v14H6zM20 5v14L9 12z"/></svg>
      </button>
      <button class="bigplay" id="npPlay" aria-label="Αναπαραγωγή"></button>
      <button class="iconbtn" id="nextBtn" aria-label="Επόμενο">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M16 5h2v14h-2zM4 5v14l11-7z"/></svg>
      </button>
      <button class="iconbtn mode" id="repeatBtn" aria-label="Επανάληψη"></button>
    </div>
    <div class="note" id="npNote" hidden><h3>Στίχοι & σημειώσεις</h3><div id="npNoteText"></div></div>
  </div>
</div>

<div class="modal" id="upModal" hidden>
  <form class="panel" id="upForm" autocomplete="off">
    <h2>Νέα τραγούδια</h2>
    <div class="drop">
      <strong>Διάλεξε αρχεία ήχου από το κινητό</strong>
      <span>MP3, M4A, WAV, OGG, FLAC. Αποθηκεύονται μόνο σε αυτή τη συσκευή.</span>
      <div><button type="button" class="btn ghost" id="pickAudio">Επιλογή αρχείων</button></div>
      <input type="file" id="audioIn" accept="audio/*,.mp3,.wav,.m4a,.flac,.ogg,.aac,.opus" multiple hidden>
    </div>
    <div class="queue-list" id="queueList"></div>
    <div class="field" id="titleField">
      <label for="upTitle">Τίτλος</label>
      <input type="text" id="upTitle" placeholder="π.χ. Νυχτερινό 3">
    </div>
    <div class="field">
      <label for="upArtist">Καλλιτέχνης</label>
      <input type="text" id="upArtist" placeholder="Το όνομά της">
    </div>
    <div class="field">
      <label>Εξώφυλλο (προαιρετικό)</label>
      <div class="coverpick">
        <div class="cover" id="upCoverPrev">♪</div>
        <button type="button" class="btn ghost" id="pickCover">Εικόνα…</button>
        <input type="file" id="coverIn" accept="image/*" hidden>
      </div>
    </div>
    <div class="field" id="upListsField" hidden>
      <label>Βάλ' τα σε playlist</label>
      <div class="checks" id="upLists"></div>
    </div>
    <div class="field" id="noteField">
      <label for="upNote">Στίχοι / σημειώσεις (προαιρετικό)</label>
      <textarea id="upNote"></textarea>
    </div>
    <div class="prog" id="upProgWrap" hidden><i id="upProg"></i></div>
    <div class="msg" id="upMsg"></div>
    <div class="row-end">
      <button type="button" class="btn ghost" id="upCancel">Άκυρο</button>
      <button type="submit" class="btn primary" id="upGo" disabled>Προσθήκη</button>
    </div>
  </form>
</div>

<div class="modal" id="edModal" hidden>
  <form class="panel" id="edForm" autocomplete="off">
    <h2>Επεξεργασία</h2>
    <div class="field"><label for="edTitle">Τίτλος</label><input type="text" id="edTitle"></div>
    <div class="field"><label for="edArtist">Καλλιτέχνης</label><input type="text" id="edArtist"></div>
    <div class="field">
      <label>Εξώφυλλο</label>
      <div class="coverpick">
        <div class="cover" id="edCoverPrev"></div>
        <button type="button" class="btn ghost" id="edPickCover">Αλλαγή…</button>
        <input type="file" id="edCoverIn" accept="image/*" hidden>
      </div>
    </div>
    <div class="field" id="edListsField" hidden><label>Playlists</label><div class="checks" id="edLists"></div></div>
    <div class="field"><label for="edNote">Στίχοι / σημειώσεις</label><textarea id="edNote"></textarea></div>
    <div class="msg" id="edMsg"></div>
    <div class="row-split">
      <button type="button" class="btn danger" id="edDelete">Διαγραφή</button>
      <div class="row-end">
        <button type="button" class="btn ghost" id="edCancel">Άκυρο</button>
        <button type="submit" class="btn primary" id="edSave">Αποθήκευση</button>
      </div>
    </div>
  </form>
</div>

<div class="modal" id="plModal" hidden>
  <form class="panel" id="plForm" autocomplete="off">
    <h2 id="plFormTitle">Νέα playlist</h2>
    <div class="field"><label for="plInput">Όνομα</label><input type="text" id="plInput" placeholder="π.χ. ROCK, CHILL, Για το λεωφορείο" maxlength="60"></div>
    <div class="msg" id="plMsg"></div>
    <div class="row-split">
      <button type="button" class="btn danger" id="plDelete" hidden>Διαγραφή playlist</button>
      <div class="row-end" style="margin-left:auto">
        <button type="button" class="btn ghost" id="plCancel">Άκυρο</button>
        <button type="submit" class="btn primary" id="plSave">Δημιουργία</button>
      </div>
    </div>
  </form>
</div>

<audio id="audio" preload="auto" playsinline></audio>
<div class="toast" id="toast" hidden></div>

<script src="app.js"></script>
</body>
</html>
